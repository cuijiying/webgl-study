<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 - 二维旋转</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="demo-container">
  <div class="demo-header">
    <a href="../../index.html">← 返回目录</a>
    <h1>04 - 二维旋转</h1>
  </div>
  <div class="demo-body">
    <div class="canvas-wrap">
      <canvas id="canvas" width="600" height="400"></canvas>
    </div>
    <div class="controls">
      <h3>🎮 交互控制</h3>
      <div class="control-group">
        <label>旋转角度: <span class="value" id="angleVal">0</span>°</label>
        <input type="range" id="angleSlider" min="0" max="360" value="0">
      </div>
      <div class="control-group">
        <label>X 平移: <span class="value" id="xVal">200</span>px</label>
        <input type="range" id="xSlider" min="0" max="580" value="200">
      </div>
      <div class="control-group">
        <label>Y 平移: <span class="value" id="yVal">150</span>px</label>
        <input type="range" id="ySlider" min="0" max="380" value="150">
      </div>
      <hr style="border-color:#2a2a4a; margin:16px 0;">
      <h3>💡 旋转数学</h3>
      <div class="info-panel" style="margin:0; border:none; padding:0; background:none;">
        <p>旋转公式：</p>
        <p><code>newX = x * cos(θ) - y * sin(θ)</code></p>
        <p><code>newY = x * sin(θ) + y * cos(θ)</code></p>
        <p>传入 <code>u_rotation</code> = <code>vec2(sin(θ), cos(θ))</code></p>
        <p style="color:#ffab40;">旋转总是围绕原点(0,0)进行，所以先旋转再平移！</p>
      </div>
    </div>
  </div>
</div>

<script id="vertex-shader" type="x-shader/x-vertex">
  attribute vec2 a_position;
  uniform vec2 u_resolution;
  uniform vec2 u_translation;
  uniform vec2 u_rotation;  // (sin(angle), cos(angle))

  void main() {
    // 先旋转（围绕原点）
    vec2 rotatedPosition = vec2(
      a_position.x * u_rotation.y - a_position.y * u_rotation.x,
      a_position.x * u_rotation.x + a_position.y * u_rotation.y
    );
    // 再平移
    vec2 position = rotatedPosition + u_translation;
    vec2 clipSpace = (position / u_resolution) * 2.0 - 1.0;
    gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
  }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
  precision mediump float;
  void main() {
    gl_FragColor = vec4(1.0, 0.5, 0.2, 1.0);
  }
</script>

<script src="../../js/webgl-utils.js"></script>
<script>
  'use strict';
  const canvas = document.getElementById('canvas');
  const gl = canvas.getContext('webgl');
  const program = WebGLUtils.createProgramFromSources(gl,
    document.getElementById('vertex-shader').text,
    document.getElementById('fragment-shader').text
  );

  const posLoc = gl.getAttribLocation(program, 'a_position');
  const resLoc = gl.getUniformLocation(program, 'u_resolution');
  const transLoc = gl.getUniformLocation(program, 'u_translation');
  const rotLoc = gl.getUniformLocation(program, 'u_rotation');

  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    0, 0, 30, 0, 0, 150,   0, 150, 30, 0, 30, 150,
    30, 0, 100, 0, 30, 30,  30, 30, 100, 0, 100, 30,
    30, 60, 70, 60, 30, 90, 30, 90, 70, 60, 70, 90,
  ]), gl.STATIC_DRAW);

  let translation = [200, 150];
  let angleInDegrees = 0;

  function drawScene() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.04, 0.04, 0.1, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(program);

    gl.enableVertexAttribArray(posLoc);
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.uniform2f(transLoc, translation[0], translation[1]);

    const angleInRadians = angleInDegrees * Math.PI / 180;
    gl.uniform2f(rotLoc, Math.sin(angleInRadians), Math.cos(angleInRadians));

    gl.drawArrays(gl.TRIANGLES, 0, 18);
  }

  document.getElementById('angleSlider').addEventListener('input', (e) => {
    angleInDegrees = +e.target.value;
    document.getElementById('angleVal').textContent = angleInDegrees;
    drawScene();
  });
  document.getElementById('xSlider').addEventListener('input', (e) => {
    translation[0] = +e.target.value;
    document.getElementById('xVal').textContent = translation[0];
    drawScene();
  });
  document.getElementById('ySlider').addEventListener('input', (e) => {
    translation[1] = +e.target.value;
    document.getElementById('yVal').textContent = translation[1];
    drawScene();
  });
  drawScene();
</script>
</body>
</html>
