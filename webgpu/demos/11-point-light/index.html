<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU 11 - 点光源</title>
  <link rel="stylesheet" href="../../../css/style.css">
  <link rel="stylesheet" href="../../css/doc.css">
</head>
<body>
<div class="demo-container">
  <div class="demo-header">
    <a href="../../index.html">← 返回 WebGPU 目录</a>
    <h1>11 - 点光源 + 高光</h1>
    <div style="flex:1"></div>
    <a class="doc-link-btn" href="doc.html">📖 查看详细文档</a>
  </div>
  <div class="demo-body">
    <div class="canvas-wrap">
      <canvas id="canvas" width="600" height="400"></canvas>
    </div>
    <div class="controls">
      <h3>🎛️ 交互控制</h3>
      <div class="control-group">
        <label>物体旋转</label><input type="range" id="ry" min="-180" max="180" value="-40"><div class="value" id="ryVal">-40°</div>
      </div>
      <div class="control-group">
        <label>光源 X 位置</label><input type="range" id="lx" min="-400" max="400" value="180"><div class="value" id="lxVal">180</div>
      </div>
      <div class="control-group">
        <label>光泽度 (shininess)</label><input type="range" id="sh" min="1" max="300" value="80"><div class="value" id="shVal">80</div>
      </div>
      <hr style="border-color:#2a2a4a; margin:12px 0;">
      <div class="info-panel" style="margin:0; border:none; padding:0; background:none;">
        <p style="color:#ffab40;">点光源有具体位置，光线方向因表面位置而异。高光 = 视线与反射光接近时的亮点。</p>
      </div>
    </div>
  </div>
  <div class="info-panel">
    <h3>📖 简介</h3>
    <p>点光源从一个具体位置向四周发光，每个表面点的光线方向都不同。本节在漫反射基础上加入 <strong>Blinn-Phong 高光</strong>：当视线方向与「光线+视线的半程向量」接近表面法线时，产生明亮的高光点。详见<a href="doc.html" style="color:#ff6ec7;">详细文档</a>。</p>
  </div>
</div>

<script src="../../js/webgpu-utils.js"></script>
<script src="../../js/geometry.js"></script>
<script>
'use strict';
const mat4 = WebGPUUtils.mat4;

const shaderCode = /* wgsl */`
  struct Uniforms {
    mvp : mat4x4f,
    model : mat4x4f,
    normalMatrix : mat4x4f,
    lightPos : vec3f,
    viewPos : vec3f,
    color : vec4f,
    shininess : f32,
  };
  @group(0) @binding(0) var<uniform> u : Uniforms;

  struct VSOut {
    @builtin(position) position : vec4f,
    @location(0) normal : vec3f,
    @location(1) surfaceToLight : vec3f,
    @location(2) surfaceToView : vec3f,
    @location(3) color : vec3f,
  };

  @vertex
  fn vs(@location(0) pos : vec3f, @location(1) color : vec3f, @location(2) normal : vec3f) -> VSOut {
    var o : VSOut;
    o.position = u.mvp * vec4f(pos, 1.0);
    let worldPos = (u.model * vec4f(pos, 1.0)).xyz;
    o.normal = (u.normalMatrix * vec4f(normal, 0.0)).xyz;
    o.surfaceToLight = u.lightPos - worldPos;  // 指向光源
    o.surfaceToView  = u.viewPos  - worldPos;  // 指向相机
    o.color = color;
    return o;
  }

  @fragment
  fn fs(in : VSOut) -> @location(0) vec4f {
    let n = normalize(in.normal);
    let L = normalize(in.surfaceToLight);
    let V = normalize(in.surfaceToView);
    let H = normalize(L + V);            // 半程向量

    let diffuse = max(dot(n, L), 0.0);
    var specular = 0.0;
    if (diffuse > 0.0) {
      specular = pow(max(dot(n, H), 0.0), u.shininess);
    }
    let ambient = 0.15;
    let rgb = in.color * (ambient + diffuse * 0.85) + vec3f(specular);
    return vec4f(rgb, 1.0);
  }
`;

async function main() {
  const canvas = document.getElementById('canvas');
  let device, context, format;
  try {
    ({ device, context, format } = await WebGPUUtils.init(canvas));
  } catch (e) {
    WebGPUUtils.showError(document.querySelector('.canvas-wrap'), e.message);
    return;
  }

  const data = Geometry.interleaved();
  const vertexBuffer = device.createBuffer({ size: data.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vertexBuffer, 0, data);

  // 256 字节（含若干填充）
  const uniformBuffer = device.createBuffer({ size: 256, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const depthTexture = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });

  const module = device.createShaderModule({ code: shaderCode });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs',
      buffers: [{ arrayStride: 9 * 4, attributes: [
        { shaderLocation: 0, offset: 0, format: 'float32x3' },
        { shaderLocation: 1, offset: 12, format: 'float32x3' },
        { shaderLocation: 2, offset: 24, format: 'float32x3' },
      ]}] },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
  });
  const bindGroup = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uniformBuffer } }] });

  const DIST = 360;
  const state = { ry: -40, lx: 180, sh: 80 };
  const uData = new Float32Array(64); // 256 字节

  function render() {
    const aspect = canvas.width / canvas.height;
    const proj = mat4.perspective(55 * Math.PI / 180, aspect, 1, 3000);
    const model = mat4.rotationY(state.ry * Math.PI / 180);
    let mvp = mat4.multiply(proj, mat4.translation(0, 0, -DIST));
    mvp = mat4.multiply(mvp, model);
    const normalMatrix = mat4.inverseTranspose(model);

    uData.set(mvp, 0);            // 0..15
    uData.set(model, 16);         // 16..31
    uData.set(normalMatrix, 32);  // 32..47
    uData[48] = state.lx; uData[49] = 120; uData[50] = 150; // lightPos
    uData[52] = 0; uData[53] = 0; uData[54] = DIST;          // viewPos (相机世界坐标)
    uData[56] = 0.55; uData[57] = 0.8; uData[58] = 1.0; uData[59] = 1.0; // color
    uData[60] = state.sh;         // shininess
    device.queue.writeBuffer(uniformBuffer, 0, uData);

    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: { r: 0.04, g: 0.04, b: 0.1, a: 1.0 }, loadOp: 'clear', storeOp: 'store' }],
      depthStencilAttachment: { view: depthTexture.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store' },
    });
    pass.setPipeline(pipeline);
    pass.setVertexBuffer(0, vertexBuffer);
    pass.setBindGroup(0, bindGroup);
    pass.draw(Geometry.vertexCount);
    pass.end();
    device.queue.submit([encoder.finish()]);
  }

  function bind(id, valId, key, suffix='') {
    const el = document.getElementById(id), valEl = document.getElementById(valId);
    el.addEventListener('input', () => { state[key] = +el.value; valEl.textContent = el.value + suffix; render(); });
  }
  bind('ry','ryVal','ry','°'); bind('lx','lxVal','lx'); bind('sh','shVal','sh');
  render();
}
main();
</script>
</body>
</html>
