<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU 07 - 三维正射投影</title>
  <link rel="stylesheet" href="../../../css/style.css">
  <link rel="stylesheet" href="../../css/doc.css">
</head>
<body>
<div class="demo-container">
  <div class="demo-header">
    <a href="../../index.html">← 返回 WebGPU 目录</a>
    <h1>07 - 三维正射投影</h1>
    <div style="flex:1"></div>
    <a class="doc-link-btn" href="doc.html">📖 查看详细文档</a>
  </div>
  <div class="demo-body">
    <div class="canvas-wrap">
      <canvas id="canvas" width="600" height="400"></canvas>
    </div>
    <div class="controls">
      <h3>🎛️ 交互控制</h3>
      <div class="control-group">
        <label>绕 X 轴旋转</label><input type="range" id="rx" min="-180" max="180" value="25"><div class="value" id="rxVal">25°</div>
      </div>
      <div class="control-group">
        <label>绕 Y 轴旋转</label><input type="range" id="ry" min="-180" max="180" value="-35"><div class="value" id="ryVal">-35°</div>
      </div>
      <hr style="border-color:#2a2a4a; margin:12px 0;">
      <div class="info-panel" style="margin:0; border:none; padding:0; background:none;">
        <p style="color:#ffab40;">正射投影：物体不会近大远小。重点是<strong>深度纹理 (Depth Texture)</strong> 让前面的面正确遮挡后面的面。</p>
      </div>
    </div>
  </div>
  <div class="info-panel">
    <h3>📖 简介</h3>
    <p>从 2D 跨入 3D！我们绘制一个有厚度的 3D "F"。本节核心是<strong>深度测试</strong>：通过创建一张深度纹理并配置 <code>depthStencil</code>，GPU 会自动比较每个像素的深度，保证近处的面遮住远处的面。WebGPU 的深度范围是 <code>[0,1]</code>（不同于 WebGL 的 <code>[-1,1]</code>）。详见<a href="doc.html" style="color:#ff6ec7;">详细文档</a>。</p>
  </div>
</div>

<script src="../../js/webgpu-utils.js"></script>
<script src="../../js/geometry.js"></script>
<script>
'use strict';
const mat4 = WebGPUUtils.mat4;

const shaderCode = /* wgsl */`
  struct Uniforms { matrix : mat4x4f };
  @group(0) @binding(0) var<uniform> u : Uniforms;

  struct VSOut {
    @builtin(position) position : vec4f,
    @location(0) color : vec3f,
  };

  @vertex
  fn vs(@location(0) pos : vec3f, @location(1) color : vec3f) -> VSOut {
    var o : VSOut;
    o.position = u.matrix * vec4f(pos, 1.0);
    o.color = color;
    return o;
  }
  @fragment
  fn fs(in : VSOut) -> @location(0) vec4f {
    return vec4f(in.color, 1.0);
  }
`;

async function main() {
  const canvas = document.getElementById('canvas');
  let device, context, format;
  try {
    ({ device, context, format } = await WebGPUUtils.init(canvas));
  } catch (e) {
    WebGPUUtils.showError(document.querySelector('.canvas-wrap'), e.message);
    return;
  }

  const data = Geometry.interleaved();          // [x,y,z, r,g,b, nx,ny,nz]
  const vertexBuffer = device.createBuffer({ size: data.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vertexBuffer, 0, data);

  const uniformBuffer = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  // 深度纹理：与画布同尺寸
  const depthTexture = device.createTexture({
    size: [canvas.width, canvas.height],
    format: 'depth24plus',
    usage: GPUTextureUsage.RENDER_ATTACHMENT,
  });

  const module = device.createShaderModule({ code: shaderCode });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs',
      buffers: [{ arrayStride: 9 * 4, attributes: [
        { shaderLocation: 0, offset: 0,     format: 'float32x3' }, // position
        { shaderLocation: 1, offset: 3 * 4, format: 'float32x3' }, // color
      ]}] },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
  });
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
  });

  const state = { rx: 25, ry: -35 };

  function render() {
    const aspect = canvas.width / canvas.height;
    const size = 180;
    // 正射投影体（深度映射到 [0,1]）
    const proj = mat4.orthographic(-size * aspect, size * aspect, -size, size, -300, 300);
    let m = mat4.multiply(proj, mat4.rotationX(state.rx * Math.PI / 180));
    m = mat4.multiply(m, mat4.rotationY(state.ry * Math.PI / 180));
    device.queue.writeBuffer(uniformBuffer, 0, m);

    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [{
        view: context.getCurrentTexture().createView(),
        clearValue: { r: 0.04, g: 0.04, b: 0.1, a: 1.0 },
        loadOp: 'clear', storeOp: 'store',
      }],
      depthStencilAttachment: {
        view: depthTexture.createView(),
        depthClearValue: 1.0,
        depthLoadOp: 'clear',
        depthStoreOp: 'store',
      },
    });
    pass.setPipeline(pipeline);
    pass.setVertexBuffer(0, vertexBuffer);
    pass.setBindGroup(0, bindGroup);
    pass.draw(Geometry.vertexCount);
    pass.end();
    device.queue.submit([encoder.finish()]);
  }

  function bind(id, valId, key) {
    const el = document.getElementById(id), valEl = document.getElementById(valId);
    el.addEventListener('input', () => { state[key] = +el.value; valEl.textContent = el.value + '°'; render(); });
  }
  bind('rx','rxVal','rx'); bind('ry','ryVal','ry');
  render();
}
main();
</script>
</body>
</html>
