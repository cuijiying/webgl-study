<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 - 图像处理</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="demo-container">
  <div class="demo-header">
    <a href="../../index.html">← 返回目录</a>
    <h1>15 - 图像处理（卷积核）</h1>
  </div>
  <div class="demo-body">
    <div class="canvas-wrap">
      <canvas id="canvas" width="600" height="400"></canvas>
    </div>
    <div class="controls">
      <h3>🎮 选择效果</h3>
      <div class="control-group">
        <select id="kernelSelect" style="width:100%; padding:8px; background:#1a1a3a; color:#e0e0e0; border:1px solid #4fc3f7; border-radius:4px; font-size:14px;">
          <option value="normal">原图</option>
          <option value="gaussianBlur">高斯模糊</option>
          <option value="sharpen">锐化</option>
          <option value="edgeDetect">边缘检测</option>
          <option value="emboss">浮雕</option>
          <option value="sobelX">Sobel 水平</option>
          <option value="sobelY">Sobel 垂直</option>
        </select>
      </div>
      <hr style="border-color:#2a2a4a; margin:16px 0;">
      <h3>💡 图像处理原理</h3>
      <div class="info-panel" style="margin:0; border:none; padding:0; background:none;">
        <p><strong>卷积核(Kernel)</strong>: 一个3×3矩阵，定义如何结合周围像素</p>
        <p>对于每个像素，取其周围9个像素，分别乘以卷积核的权重并求和</p>
        <p><strong>GPU的优势</strong>：每个像素的计算完全独立，天然适合并行！</p>
        <p style="color:#ffab40;">用 <code>texture2D</code> 采样相邻像素，<code>u_textureSize</code> 计算1像素的UV偏移</p>
        <p>此Demo使用程序生成的测试图案</p>
      </div>
      <hr style="border-color:#2a2a4a; margin:16px 0;">
      <h3>当前卷积核</h3>
      <pre id="kernelDisplay" style="font-size:12px; color:#80cbc4; line-height:1.5; font-family:monospace;"></pre>
    </div>
  </div>
</div>

<script id="vertex-shader" type="x-shader/x-vertex">
  attribute vec2 a_position;
  attribute vec2 a_texCoord;
  uniform vec2 u_resolution;
  varying vec2 v_texCoord;

  void main() {
    // 像素坐标转裁剪空间
    vec2 clipSpace = ((a_position / u_resolution) * 2.0 - 1.0) * vec2(1, -1);
    gl_Position = vec4(clipSpace, 0, 1);
    v_texCoord = a_texCoord;
  }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
  precision mediump float;
  uniform sampler2D u_image;
  uniform vec2 u_textureSize;
  uniform float u_kernel[9];
  uniform float u_kernelWeight;
  varying vec2 v_texCoord;

  void main() {
    // 计算1像素对应的纹理坐标偏移
    vec2 onePixel = vec2(1.0) / u_textureSize;

    // 采样周围9个像素，乘以卷积核权重
    vec4 color =
      texture2D(u_image, v_texCoord + onePixel * vec2(-1, -1)) * u_kernel[0] +
      texture2D(u_image, v_texCoord + onePixel * vec2( 0, -1)) * u_kernel[1] +
      texture2D(u_image, v_texCoord + onePixel * vec2( 1, -1)) * u_kernel[2] +
      texture2D(u_image, v_texCoord + onePixel * vec2(-1,  0)) * u_kernel[3] +
      texture2D(u_image, v_texCoord + onePixel * vec2( 0,  0)) * u_kernel[4] +
      texture2D(u_image, v_texCoord + onePixel * vec2( 1,  0)) * u_kernel[5] +
      texture2D(u_image, v_texCoord + onePixel * vec2(-1,  1)) * u_kernel[6] +
      texture2D(u_image, v_texCoord + onePixel * vec2( 0,  1)) * u_kernel[7] +
      texture2D(u_image, v_texCoord + onePixel * vec2( 1,  1)) * u_kernel[8];

    gl_FragColor = vec4((color / u_kernelWeight).rgb, 1.0);
  }
</script>

<script src="../../js/webgl-utils.js"></script>
<script>
  'use strict';

  // 定义各种卷积核
  const kernels = {
    normal:       [0,0,0, 0,1,0, 0,0,0],
    gaussianBlur: [1,2,1, 2,4,2, 1,2,1],
    sharpen:      [0,-1,0, -1,5,-1, 0,-1,0],
    edgeDetect:   [-1,-1,-1, -1,8,-1, -1,-1,-1],
    emboss:       [-2,-1,0, -1,1,1, 0,1,2],
    sobelX:       [-1,0,1, -2,0,2, -1,0,1],
    sobelY:       [-1,-2,-1, 0,0,0, 1,2,1],
  };

  const canvas = document.getElementById('canvas');
  const gl = canvas.getContext('webgl');
  const program = WebGLUtils.createProgramFromSources(gl,
    document.getElementById('vertex-shader').text,
    document.getElementById('fragment-shader').text
  );

  const posLoc = gl.getAttribLocation(program, 'a_position');
  const texCoordLoc = gl.getAttribLocation(program, 'a_texCoord');
  const resLoc = gl.getUniformLocation(program, 'u_resolution');
  const texSizeLoc = gl.getUniformLocation(program, 'u_textureSize');
  const kernelLoc = gl.getUniformLocation(program, 'u_kernel[0]');
  const kernelWeightLoc = gl.getUniformLocation(program, 'u_kernelWeight');

  // 用程序生成测试图案（256x256）
  const imgW = 256, imgH = 256;
  const imgData = new Uint8Array(imgW * imgH * 4);
  for (let y = 0; y < imgH; y++) {
    for (let x = 0; x < imgW; x++) {
      const idx = (y * imgW + x) * 4;
      // 彩色圆环图案
      const cx = x - imgW / 2, cy = y - imgH / 2;
      const dist = Math.sqrt(cx * cx + cy * cy);
      const ring = Math.sin(dist * 0.15) * 0.5 + 0.5;
      const checker = ((x >> 4) + (y >> 4)) % 2;

      imgData[idx]     = Math.floor((ring * 200 + checker * 55) * (0.5 + 0.5 * Math.sin(x * 0.05))); // R
      imgData[idx + 1] = Math.floor((ring * 150 + 50) * (0.5 + 0.5 * Math.cos(y * 0.05)));           // G
      imgData[idx + 2] = Math.floor(180 + 75 * Math.sin((x + y) * 0.03));                              // B
      imgData[idx + 3] = 255;
    }
  }

  // 创建并上传纹理
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, imgW, imgH, 0, gl.RGBA, gl.UNSIGNED_BYTE, imgData);

  // 矩形顶点位置（覆盖整个画布）
  const x1 = 0, y1 = 0, x2 = canvas.width, y2 = canvas.height;
  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    x1,y1, x2,y1, x1,y2, x1,y2, x2,y1, x2,y2
  ]), gl.STATIC_DRAW);

  // 纹理坐标
  const texBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, texBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    0,0, 1,0, 0,1, 0,1, 1,0, 1,1
  ]), gl.STATIC_DRAW);

  function computeKernelWeight(kernel) {
    const weight = kernel.reduce((a, b) => a + b, 0);
    return weight <= 0 ? 1 : weight;
  }

  function drawWithKernel(kernelName) {
    const kernel = kernels[kernelName];

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(program);

    gl.enableVertexAttribArray(posLoc);
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    gl.enableVertexAttribArray(texCoordLoc);
    gl.bindBuffer(gl.ARRAY_BUFFER, texBuf);
    gl.vertexAttribPointer(texCoordLoc, 2, gl.FLOAT, false, 0, 0);

    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.uniform2f(texSizeLoc, imgW, imgH);
    gl.uniform1fv(kernelLoc, kernel);
    gl.uniform1f(kernelWeightLoc, computeKernelWeight(kernel));

    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // 显示卷积核
    document.getElementById('kernelDisplay').textContent =
      `[ ${kernel[0]}, ${kernel[1]}, ${kernel[2]} ]\n` +
      `[ ${kernel[3]}, ${kernel[4]}, ${kernel[5]} ]\n` +
      `[ ${kernel[6]}, ${kernel[7]}, ${kernel[8]} ]`;
  }

  document.getElementById('kernelSelect').addEventListener('change', (e) => {
    drawWithKernel(e.target.value);
  });

  drawWithKernel('normal');
</script>
</body>
</html>
