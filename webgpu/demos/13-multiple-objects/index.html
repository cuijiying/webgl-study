<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU 13 - 绘制多个物体</title>
  <link rel="stylesheet" href="../../../css/style.css">
  <link rel="stylesheet" href="../../css/doc.css">
</head>
<body>
<div class="demo-container">
  <div class="demo-header">
    <a href="../../index.html">← 返回 WebGPU 目录</a>
    <h1>13 - 绘制多个物体 (动态偏移)</h1>
    <div style="flex:1"></div>
    <a class="doc-link-btn" href="doc.html">📖 查看详细文档</a>
  </div>
  <div class="demo-body">
    <div class="canvas-wrap">
      <canvas id="canvas" width="600" height="400"></canvas>
    </div>
    <div class="controls">
      <h3>🎛️ 交互控制</h3>
      <div class="control-group">
        <label>物体数量</label><input type="range" id="count" min="1" max="64" value="25"><div class="value" id="countVal">25</div>
      </div>
      <div class="control-group">
        <label>相机环绕</label><input type="range" id="ang" min="0" max="360" value="20"><div class="value" id="angVal">20°</div>
      </div>
      <hr style="border-color:#2a2a4a; margin:12px 0;">
      <div class="info-panel" style="margin:0; border:none; padding:0; background:none;">
        <p style="color:#ffab40;">用<strong>一个大 Uniform Buffer</strong> 存放所有物体的数据，绘制时用 <code>dynamic offset</code> 切换到各自的数据段。</p>
      </div>
    </div>
  </div>
  <div class="info-panel">
    <h3>📖 简介</h3>
    <p>绘制大量物体时，为每个物体单独建 buffer 太浪费。本节用<strong>动态 Uniform 偏移</strong>：把所有物体数据放进一个大缓冲，<code>setBindGroup(0, bg, [offset])</code> 在绘制每个物体前切换偏移。注意偏移必须按 256 字节对齐。详见<a href="doc.html" style="color:#ff6ec7;">详细文档</a>。</p>
  </div>
</div>

<script src="../../js/webgpu-utils.js"></script>
<script src="../../js/geometry.js"></script>
<script>
'use strict';
const mat4 = WebGPUUtils.mat4;

const MAX = 64;
const STRIDE = 256; // 每个物体占 256 字节（满足 minUniformBufferOffsetAlignment）

const shaderCode = /* wgsl */`
  struct Obj { matrix : mat4x4f, color : vec4f };
  @group(0) @binding(0) var<uniform> obj : Obj;

  struct VSOut { @builtin(position) position : vec4f, @location(0) shade : f32 };

  @vertex
  fn vs(@location(0) pos : vec3f, @location(2) normal : vec3f) -> VSOut {
    var o : VSOut;
    o.position = obj.matrix * vec4f(pos, 1.0);
    // 简单方向光（固定方向），仅用法线的 z 近似明暗
    let n = normalize(normal);
    o.shade = 0.4 + 0.6 * max(dot(n, normalize(vec3f(0.3, 0.5, 1.0))), 0.0);
    return o;
  }
  @fragment
  fn fs(in : VSOut) -> @location(0) vec4f {
    return vec4f(obj.color.rgb * in.shade, 1.0);
  }
`;

async function main() {
  const canvas = document.getElementById('canvas');
  let device, context, format;
  try {
    ({ device, context, format } = await WebGPUUtils.init(canvas));
  } catch (e) {
    WebGPUUtils.showError(document.querySelector('.canvas-wrap'), e.message);
    return;
  }

  const data = Geometry.interleaved();
  const vertexBuffer = device.createBuffer({ size: data.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vertexBuffer, 0, data);
  const depthTexture = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });

  // 一个大 uniform buffer 容纳所有物体
  const uniformBuffer = device.createBuffer({ size: MAX * STRIDE, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  // 显式声明带动态偏移的 bind group layout
  const bgl = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'uniform', hasDynamicOffset: true } }],
  });
  const pipelineLayout = device.createPipelineLayout({ bindGroupLayouts: [bgl] });

  const module = device.createShaderModule({ code: shaderCode });
  const pipeline = device.createRenderPipeline({
    layout: pipelineLayout,
    vertex: { module, entryPoint: 'vs',
      buffers: [{ arrayStride: 9 * 4, attributes: [
        { shaderLocation: 0, offset: 0, format: 'float32x3' },
        { shaderLocation: 2, offset: 24, format: 'float32x3' },
      ]}] },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
  });

  // 绑定时 size 必须是单个物体的数据大小（80 字节），并开启 dynamic offset
  const bindGroup = device.createBindGroup({
    layout: bgl,
    entries: [{ binding: 0, resource: { buffer: uniformBuffer, offset: 0, size: 80 } }],
  });

  const palette = [[1,0.43,0.78],[0.55,0.8,1],[1,0.85,0.4],[0.5,1,0.6],[0.8,0.5,1],[1,0.6,0.4]];
  const state = { count: 25, ang: 20 };
  const big = new Float32Array(MAX * STRIDE / 4); // 整块数据

  function render() {
    const aspect = canvas.width / canvas.height;
    const proj = mat4.perspective(60 * Math.PI / 180, aspect, 1, 4000);
    const a = state.ang * Math.PI / 180;
    const R = 900;
    const eye = [Math.sin(a) * R, 300, Math.cos(a) * R];
    const view = mat4.lookAt(eye, [0, 0, 0], [0, 1, 0]);
    const viewProj = mat4.multiply(proj, view);

    const n = state.count;
    const cols = Math.ceil(Math.sqrt(n));
    const spacing = 180;
    for (let i = 0; i < n; i++) {
      const gx = (i % cols) - (cols - 1) / 2;
      const gz = Math.floor(i / cols) - (cols - 1) / 2;
      let model = mat4.translation(gx * spacing, 0, gz * spacing);
      model = mat4.multiply(model, mat4.rotationY((i * 37) * Math.PI / 180));
      const mvp = mat4.multiply(viewProj, model);
      const base = i * (STRIDE / 4);
      big.set(mvp, base);
      const c = palette[i % palette.length];
      big[base + 16] = c[0]; big[base + 17] = c[1]; big[base + 18] = c[2]; big[base + 19] = 1;
    }
    device.queue.writeBuffer(uniformBuffer, 0, big, 0, n * (STRIDE / 4));

    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: { r: 0.04, g: 0.04, b: 0.1, a: 1.0 }, loadOp: 'clear', storeOp: 'store' }],
      depthStencilAttachment: { view: depthTexture.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store' },
    });
    pass.setPipeline(pipeline);
    pass.setVertexBuffer(0, vertexBuffer);
    for (let i = 0; i < n; i++) {
      pass.setBindGroup(0, bindGroup, [i * STRIDE]); // ← 动态偏移
      pass.draw(Geometry.vertexCount);
    }
    pass.end();
    device.queue.submit([encoder.finish()]);
  }

  function bind(id, valId, key, suffix='') {
    const el = document.getElementById(id), valEl = document.getElementById(valId);
    el.addEventListener('input', () => { state[key] = +el.value; valEl.textContent = el.value + suffix; render(); });
  }
  bind('count','countVal','count'); bind('ang','angVal','ang','°');
  render();
}
main();
</script>
</body>
</html>
